[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-reporting-pipeline"
version = "0.1.0"
description = "Reproducible sales reporting pipeline: CSV ingestion, quality checks, SQL star schema (SQLite or PostgreSQL), KPIs and Power BI-ready exports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]
dev = ["psycopg[binary]>=3.3,<4", "pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.scripts]
reporting-pipeline = "reporting_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reporting_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S608"]
"scripts/**" = ["S603", "S607"]
